<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/flowers.png" type="image/x-icon">

    <title>Flowers</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 70%, rgba(21, 65, 45, 0.18), transparent 35%),
                radial-gradient(circle at 50% 20%, rgba(20, 70, 75, 0.12), transparent 40%),
                #020707;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }


        /* ========================= */
        /* FONDO NOCTURNO */
        /* ========================= */

        .night {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,255,220,.04), transparent 20%),
                radial-gradient(circle at 80% 30%, rgba(0,255,220,.03), transparent 25%);
        }


        /* ========================= */
        /* PARTÍCULAS */
        /* ========================= */

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;

            background: #64fff2;

            box-shadow:
                0 0 6px #64fff2,
                0 0 14px #2dfff0;

            animation: twinkle 3s infinite ease-in-out;
        }

        .particle.yellow {
            background: #ffe94d;

            box-shadow:
                0 0 6px #ffe94d,
                0 0 15px #ffd500;
        }


        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-delay: .4s;
        }

        .particle:nth-child(2) {
            left: 22%;
            top: 13%;
            animation-delay: 1.3s;
        }

        .particle:nth-child(3) {
            left: 35%;
            top: 28%;
            animation-delay: .7s;
        }

        .particle:nth-child(4) {
            left: 44%;
            top: 16%;
            animation-delay: 2s;
        }

        .particle:nth-child(5) {
            left: 55%;
            top: 22%;
            animation-delay: .2s;
        }

        .particle:nth-child(6) {
            left: 68%;
            top: 15%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(7) {
            left: 77%;
            top: 28%;
            animation-delay: .8s;
        }

        .particle:nth-child(8) {
            left: 88%;
            top: 18%;
            animation-delay: 2.2s;
        }

        .particle:nth-child(9) {
            left: 15%;
            top: 40%;
            animation-delay: 1.2s;
        }

        .particle:nth-child(10) {
            left: 29%;
            top: 35%;
            animation-delay: .4s;
        }

        .particle:nth-child(11) {
            left: 63%;
            top: 39%;
            animation-delay: 1.7s;
        }

        .particle:nth-child(12) {
            left: 83%;
            top: 43%;
            animation-delay: .9s;
        }

        .particle:nth-child(13) {
            left: 47%;
            top: 31%;
            animation-delay: 2.4s;
        }

        .particle:nth-child(14) {
            left: 72%;
            top: 10%;
            animation-delay: 1.1s;
        }


        @keyframes twinkle {

            0%, 100% {
                opacity: .2;
                transform: scale(.6);
            }

            50% {
                opacity: 1;
                transform: scale(1.4);
            }

        }


        /* ========================= */
        /* GRUPO DE FLORES */
        /* ========================= */

        .garden {
            position: absolute;

            left: 50%;
            bottom: 0;

            width: 900px;
            height: 700px;

            transform: translateX(-50%);
        }


        /* ========================= */
        /* FLOR DE LOTO */
        /* ========================= */

        .lotus {
            position: absolute;

            bottom: 130px;

            width: 220px;
            height: 480px;

            transform-origin: bottom center;

            animation:
                grow 2.7s ease-out both,
                sway 6s ease-in-out infinite 2.7s;
        }


        /* POSICIONES */

        .lotus--1 {
            left: 90px;
            height: 390px;
            transform: rotate(-12deg);
        }

        .lotus--2 {
            left: 340px;
            height: 540px;
        }

        .lotus--3 {
            right: 100px;
            height: 430px;
            transform: rotate(10deg);
        }


        /* ========================= */
        /* TALLO */
        /* ========================= */

        .stem {
            position: absolute;

            bottom: 0;
            left: 50%;

            width: 16px;
            height: calc(100% - 100px);

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                linear-gradient(
                    to right,
                    #075c59,
                    #26d1c8 45%,
                    #45eee2 55%,
                    #076461
                );

            box-shadow:
                0 0 12px rgba(38, 209, 200, .25);
        }


        /* ========================= */
        /* HOJAS DEL TALLO */
        /* ========================= */

        .leaf {
            position: absolute;

            width: 85px;
            height: 42px;

            background:
                linear-gradient(
                    135deg,
                    #0e742e,
                    #43d640,
                    #0c6627
                );

            border-radius:
                100% 0
                100% 0;

            filter:
                drop-shadow(
                    0 0 6px
                    rgba(61, 221, 73, .2)
                );
        }


        .leaf.left {

            left: 35px;

            transform:
                rotate(25deg);
        }


        .leaf.right {

            right: 35px;

            transform:
                scaleX(-1)
                rotate(25deg);
        }


        .leaf--1 {
            bottom: 130px;
        }

        .leaf--2 {
            bottom: 210px;
        }

        .leaf--3 {
            bottom: 290px;
        }

        .leaf--4 {
            bottom: 350px;
        }


        /* ========================= */
        /* CABEZA DEL LOTO */
        /* ========================= */

        .flower-head {

            position: absolute;

            top: 0;
            left: 50%;

            width: 210px;
            height: 150px;

            transform:
                translateX(-50%)
                scale(0);

            transform-origin:
                center bottom;

            animation:
                bloom 2s ease-out
                1.6s forwards;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(255, 220, 40, .45)
                );
        }


        /* ========================= */
        /* PÉTALOS */
        /* ========================= */

        .petal {

            position: absolute;

            left: 50%;
            bottom: 28px;

            width: 62px;
            height: 105px;

            margin-left: -31px;

            transform-origin:
                50% 100%;

            border-radius:
                70% 70% 45% 45%;

            background:

                radial-gradient(
                    ellipse at 50% 25%,
                    #fffbd0 0%,
                    #fff36a 25%,
                    #ffe12e 60%,
                    #e8b900 100%
                );

            box-shadow:

                inset 0 -10px 15px
                rgba(214, 155, 0, .18),

                0 0 8px
                rgba(255, 231, 72, .22);
        }


        /* PÉTALOS TRASEROS */

        .p1 {
            transform:
                translateX(-52px)
                rotate(-55deg)
                scale(.92);
        }

        .p2 {
            transform:
                translateX(-34px)
                rotate(-38deg)
                scale(.97);
        }

        .p3 {
            transform:
                translateX(-15px)
                rotate(-20deg);
        }

        .p4 {
            transform:
                rotate(0deg)
                translateY(-15px)
                scale(1.05);
        }

        .p5 {
            transform:
                translateX(15px)
                rotate(20deg);
        }

        .p6 {
            transform:
                translateX(34px)
                rotate(38deg)
                scale(.97);
        }

        .p7 {
            transform:
                translateX(52px)
                rotate(55deg)
                scale(.92);
        }


        /* ========================= */
        /* PÉTALOS DELANTEROS */
        /* ========================= */

        .petal.front {

            width: 70px;
            height: 78px;

            bottom: 18px;

            margin-left: -35px;

            background:

                radial-gradient(
                    ellipse at 50% 20%,
                    #fffbd0,
                    #ffe851 38%,
                    #f5c817 75%,
                    #cf9e00
                );
        }


        .p8 {

            transform:
                translateX(-44px)
                rotate(-48deg)
                scale(.9);
        }


        .p9 {

            transform:
                translateX(-24px)
                rotate(-25deg);
        }


        .p10 {

            transform:
                translateY(8px);
        }


        .p11 {

            transform:
                translateX(24px)
                rotate(25deg);
        }


        .p12 {

            transform:
                translateX(44px)
                rotate(48deg)
                scale(.9);
        }


        /* ========================= */
        /* CENTRO */
        /* ========================= */

        .flower-center {

            position: absolute;

            left: 50%;
            bottom: 24px;

            transform:
                translateX(-50%);

            width: 62px;
            height: 25px;

            border-radius: 50%;

            background:

                radial-gradient(
                    ellipse,
                    #ffd92f,
                    #e9a900 70%
                );

            box-shadow:

                0 0 7px
                #fff06a,

                0 0 20px
                rgba(255, 218, 60, .55);
        }


        /* ========================= */
        /* LUZ DETRÁS DE LAS FLORES */
        /* ========================= */

        .flower-glow {

            position: absolute;

            width: 220px;
            height: 220px;

            left: 50%;

            top: -45px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255, 218, 40, .22),
                    rgba(255, 215, 40, .06) 45%,
                    transparent 70%
                );

            filter:
                blur(15px);

            z-index: -1;
        }


        /* ========================= */
        /* PASTO */
        /* ========================= */

        .grass {

            position: absolute;

            bottom: -60px;

            width: 15px;
            height: 390px;

            border-radius: 100%;

            transform-origin:
                bottom;

            background:

                linear-gradient(
                    to top,
                    #034a16,
                    #17b229
                );

            opacity: .85;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(20, 160, 40, .18)
                );

            animation:
                grassMove
                5s ease-in-out
                infinite;
        }


        .grass:nth-of-type(1) {
            left: 5%;
            transform: rotate(-17deg);
        }

        .grass:nth-of-type(2) {
            left: 12%;
            height: 500px;
            transform: rotate(9deg);
        }

        .grass:nth-of-type(3) {
            left: 20%;
            height: 310px;
            transform: rotate(-23deg);
        }

        .grass:nth-of-type(4) {
            left: 27%;
            height: 360px;
            transform: rotate(15deg);
        }

        .grass:nth-of-type(5) {
            left: 36%;
            height: 290px;
            transform: rotate(-9deg);
        }

        .grass:nth-of-type(6) {
            left: 48%;
            height: 330px;
            transform: rotate(13deg);
        }

        .grass:nth-of-type(7) {
            left: 58%;
            height: 290px;
            transform: rotate(-17deg);
        }

        .grass:nth-of-type(8) {
            left: 68%;
            height: 360px;
            transform: rotate(20deg);
        }

        .grass:nth-of-type(9) {
            left: 77%;
            height: 310px;
            transform: rotate(-12deg);
        }

        .grass:nth-of-type(10) {
            left: 88%;
            height: 450px;
            transform: rotate(14deg);
        }

        .grass:nth-of-type(11) {
            left: 96%;
            height: 340px;
            transform: rotate(-16deg);
        }


        /* ========================= */
        /* ANIMACIONES */
        /* ========================= */

        @keyframes bloom {

            0% {

                transform:
                    translateX(-50%)
                    scale(0)
                    rotate(-8deg);

                opacity: 0;
            }


            60% {

                transform:
                    translateX(-50%)
                    scale(1.1);
            }


            100% {

                transform:
                    translateX(-50%)
                    scale(1);

                opacity: 1;
            }

        }


        @keyframes grow {

            0% {

                transform:
                    scaleY(0);

                opacity: 0;
            }


            100% {

                opacity: 1;
            }

        }


        @keyframes sway {

            0%, 100% {

                rotate: -1.5deg;
            }


            50% {

                rotate: 1.5deg;
            }

        }


        @keyframes grassMove {

            0%, 100% {

                rotate: -2deg;
            }


            50% {

                rotate: 3deg;
            }

        }


        /* ========================= */
        /* RESPONSIVE */
        /* ========================= */

        @media screen and (max-width: 700px) {

            .garden {

                width: 620px;

                transform:
                    translateX(-50%)
                    scale(.8);

                transform-origin:
                    bottom center;
            }


            .lotus--1 {

                left: 60px;
            }


            .lotus--2 {

                left: 205px;
            }


            .lotus--3 {

                right: 50px;
            }

        }

    </style>

</head>


<body>


    <!-- Música -->
    <audio
        src="sound/ChristianBasso&HaienQiu-Flowers.mp3"
        autoplay
        loop>
    </audio>


    <div class="scene">


        <div class="night"></div>

        <h1 class="titulo">
            Unas flores de loto amarilla para mi bebé.
            <br><br>
            Gracias por ser mi ser de luz.
</h1>


        <!-- Luces -->

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle yellow"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle yellow"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle yellow"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle yellow"></span>
        <span class="particle"></span>


        <div class="garden">


            <!-- ================= -->
            <!-- LOTO IZQUIERDO -->
            <!-- ================= -->

            <div class="lotus lotus--1">


                <div class="stem"></div>


                <div class="leaf left leaf--1"></div>
                <div class="leaf right leaf--2"></div>
                <div class="leaf left leaf--3"></div>


                <div class="flower-head">

                    <div class="flower-glow"></div>

                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="petal p6"></div>
                    <div class="petal p7"></div>

                    <div class="petal front p8"></div>
                    <div class="petal front p9"></div>
                    <div class="petal front p10"></div>
                    <div class="petal front p11"></div>
                    <div class="petal front p12"></div>

                    <div class="flower-center"></div>

                </div>


            </div>



            <!-- ================= -->
            <!-- LOTO CENTRAL -->
            <!-- ================= -->

            <div class="lotus lotus--2">


                <div class="stem"></div>


                <div class="leaf right leaf--1"></div>
                <div class="leaf left leaf--2"></div>
                <div class="leaf right leaf--3"></div>
                <div class="leaf left leaf--4"></div>


                <div class="flower-head">

                    <div class="flower-glow"></div>

                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="petal p6"></div>
                    <div class="petal p7"></div>

                    <div class="petal front p8"></div>
                    <div class="petal front p9"></div>
                    <div class="petal front p10"></div>
                    <div class="petal front p11"></div>
                    <div class="petal front p12"></div>

                    <div class="flower-center"></div>

                </div>


            </div>



            <!-- ================= -->
            <!-- LOTO DERECHO -->
            <!-- ================= -->

            <div class="lotus lotus--3">


                <div class="stem"></div>


                <div class="leaf left leaf--1"></div>
                <div class="leaf right leaf--2"></div>
                <div class="leaf left leaf--3"></div>


                <div class="flower-head">

                    <div class="flower-glow"></div>

                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="petal p6"></div>
                    <div class="petal p7"></div>

                    <div class="petal front p8"></div>
                    <div class="petal front p9"></div>
                    <div class="petal front p10"></div>
                    <div class="petal front p11"></div>
                    <div class="petal front p12"></div>

                    <div class="flower-center"></div>

                </div>


            </div>



            <!-- PASTO -->

            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>
            <div class="grass"></div>


        </div>


    </div>


</body>

</html>
